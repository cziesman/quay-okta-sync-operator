apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quayoktasyncs.identity.example.com
spec:
  group: identity.example.com
  scope: Namespaced
  names:
    plural: quayoktasyncs
    singular: quayoktasync
    kind: QuayOktaSync
    shortNames: [qos]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [oktaBaseUrl, quayBaseUrl, credentialsSecret, quayOrganization]
              properties:
                oktaBaseUrl:
                  type: string
                quayBaseUrl:
                  type: string
                credentialsSecret:
                  type: string
                intervalSeconds:
                  type: integer
                  minimum: 60
                  default: 900
                dryRun:
                  type: boolean
                  default: true
                groupNamePattern:
                  type: string
                  default: '^[^-]+-[^-]+-([^-]+)-[^-]+$'
                  description: Java regular expression matched against each Okta group name; capture group 1 supplies the Quay team name.
                oktaUsernameAttribute:
                  type: string
                  default: login
                quayOrganization:
                  type: string
                quayRole:
                  type: string
                  enum: [member, creator, admin]
                  default: member
                removeExtraMembers:
                  type: boolean
                  default: false
                teamNameOverrides:
                  type: array
                  description: Optional exact Okta group names to include even when they do not match groupNamePattern, or to override the parsed Quay team name.
                  items:
                    type: object
                    required: [oktaGroup, quayTeam]
                    properties:
                      oktaGroup:
                        type: string
                      quayTeam:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                lastSyncTime:
                  type: string
