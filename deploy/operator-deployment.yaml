apiVersion: apps/v1
kind: Deployment
metadata:
  name: quay-okta-sync-operator
  namespace: quay-okta-sync-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: quay-okta-sync-operator}
  template:
    metadata:
      labels: {app: quay-okta-sync-operator}
    spec:
      serviceAccountName: quay-okta-sync-operator
      containers:
      - name: operator
        image: image-registry.openshift-image-registry.svc:5000/quay-okta-sync-system/quay-okta-sync-operator:0.1.0
        imagePullPolicy: Always
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75"
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 768Mi}
