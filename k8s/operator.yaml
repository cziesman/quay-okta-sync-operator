apiVersion: v1
kind: Namespace
metadata:
  name: quay-okta-sync-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quayoktasyncs.quayoktasync.io
spec:
  group: quayoktasync.io
  scope: Namespaced
  names:
    plural: quayoktasyncs
    singular: quayoktasync
    kind: QuayOktaSync
    shortNames: [qos]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [oktaBaseUrl, quayBaseUrl, credentialsSecret, quayOrganization]
              properties:
                oktaBaseUrl:
                  type: string
                quayBaseUrl:
                  type: string
                credentialsSecret:
                  type: string
                intervalSeconds:
                  type: integer
                  minimum: 60
                  default: 900
                dryRun:
                  type: boolean
                  default: true
                groupNamePattern:
                  type: string
                  default: '^[^-]+-[^-]+-([^-]+)-[^-]+$'
                  description: Java regular expression matched against each Okta group name; capture group 1 supplies the Quay team name.
                oktaUsernameAttribute:
                  type: string
                  default: login
                quayOrganization:
                  type: string
                quayRole:
                  type: string
                  enum: [member, creator, admin]
                  default: member
                removeExtraMembers:
                  type: boolean
                  default: false
                teamNameOverrides:
                  type: array
                  description: Optional exact Okta group names to include even when they do not match groupNamePattern, or to override the parsed Quay team name.
                  items:
                    type: object
                    required: [oktaGroup, quayTeam]
                    properties:
                      oktaGroup:
                        type: string
                      quayTeam:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                lastSyncTime:
                  type: string
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quay-okta-sync-operator
  namespace: quay-okta-sync-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quay-okta-sync-operator
rules:
  - apiGroups:
      - ""
      - "extensions"
      - "apps"
    resources:
      - deployments
      - services
      - pods
      - pods/exec
    verbs:
      - '*'
  - apiGroups:
      - "apiextensions.k8s.io"
    resources:
      - customresourcedefinitions
    verbs:
      - '*'
  - apiGroups:
      - "quayoktasync.io"
    resources:
      - quayoktasyncs
      - quayoktasyncs/status
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quay-okta-sync-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quay-okta-sync-operator
subjects:
- kind: ServiceAccount
  name: quay-okta-sync-operator
  namespace: quay-okta-sync-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quay-okta-sync-operator
  namespace: quay-okta-sync-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: quay-okta-sync-operator}
  template:
    metadata:
      labels: {app: quay-okta-sync-operator}
    spec:
      serviceAccountName: quay-okta-sync-operator
      containers:
      - name: operator
        image: image-registry.openshift-image-registry.svc:5000/quay-okta-sync-system/quay-okta-sync-operator:0.1.0
        imagePullPolicy: Always
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 768Mi}
